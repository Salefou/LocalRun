# Publishes LocalRun to nuget.org when a v<version> tag is pushed (see README "Releasing").
# Started by hand instead, it runs everything but the publishing steps.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    # Windows, like CI and the machines LocalRun is tested on
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # nuget.org Trusted Publishing (GitHub OIDC token, no stored API key)
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $version = (dotnet msbuild src/LocalRun/LocalRun.csproj -getProperty:VersionPrefix).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw "Could not read VersionPrefix" }
          if ($env:PUBLISH -eq 'true' -and "${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} doesn't match VersionPrefix $version in src/LocalRun/LocalRun.csproj"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version (publish: $env:PUBLISH)"

      - name: Restore
        run: dotnet restore LocalRun.sln

      - name: Build
        run: dotnet build LocalRun.sln -c Release --no-restore

      - name: Test
        run: dotnet test LocalRun.sln -c Release --no-build

      # No VersionSuffix: the package is the plain VersionPrefix release
      - name: Pack
        run: dotnet pack src/LocalRun/LocalRun.csproj -c Release --no-build -o artifacts/release

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $changelog = Get-Content CHANGELOG.md -Raw
          $match = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|^\[)")
          if (-not $match.Success) { throw "CHANGELOG.md has no '## [$version]' section" }
          $match.Groups[1].Value.Trim() | Set-Content artifacts/release-notes.md -Encoding utf8
          Get-Content artifacts/release-notes.md

      - name: NuGet login (OIDC → temporary API key)
        if: env.PUBLISH == 'true'
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushing the .nupkg also pushes the .snupkg next to it (symbols)
      - name: Push to nuget.org
        if: env.PUBLISH == 'true'
        run: dotnet nuget push "artifacts/release/LocalRun.${{ steps.version.outputs.version }}.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

      - name: GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # pwsh doesn't expand globs for native commands: list the packages explicitly
        run: |
          $packages = (Get-ChildItem artifacts/release -Filter *nupkg).FullName
          gh release create "${{ github.ref_name }}" @packages --title "LocalRun ${{ steps.version.outputs.version }}" --notes-file artifacts/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
